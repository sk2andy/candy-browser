services:
  candy-sync:
    build:
      context: .
      target: runtime
    environment:
      CANDY_SYNC_USERNAME: ${CANDY_SYNC_USERNAME:?set CANDY_SYNC_USERNAME}
      CANDY_SYNC_PASSWORD: ${CANDY_SYNC_PASSWORD:?set CANDY_SYNC_PASSWORD}
      CANDY_SYNC_LISTEN_ADDR: ":8080"
      CANDY_SYNC_DB_PATH: /data/candy-sync.sqlite3
      CANDY_SYNC_PUBLIC_URL: ${CANDY_SYNC_PUBLIC_URL:-https://localhost:8443}
      CANDY_SYNC_ALLOW_HTTP: ${CANDY_SYNC_ALLOW_HTTP:-false}
      CANDY_SYNC_LOG_LEVEL: ${CANDY_SYNC_LOG_LEVEL:-info}
      CANDY_SYNC_CLIENT_IP_HEADER: ${CANDY_SYNC_CLIENT_IP_HEADER:-X-Forwarded-For}
    expose:
      - "8080"
    volumes:
      - candy-sync-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

  candy-sync-tls:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    depends_on:
      candy-sync:
        condition: service_healthy
    environment:
      CANDY_SYNC_TLS_HOST: ${CANDY_SYNC_TLS_HOST:-localhost}
    ports:
      - "${CANDY_SYNC_BIND_ADDRESS:-127.0.0.1}:${CANDY_SYNC_PORT:-8080}:7070"
      - "${CANDY_SYNC_BIND_ADDRESS:-127.0.0.1}:${CANDY_SYNC_TLS_PORT:-8443}:7443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - candy-sync-tls-data:/data
      - candy-sync-tls-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:7070/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  candy-sync-data:
  candy-sync-tls-data:
  candy-sync-tls-config:
