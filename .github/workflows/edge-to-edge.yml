name: Edge-to-edge regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: edge-to-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-engines:
    name: GeckoView and System WebView safe-area contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "emulator" \
            "platform-tools" \
            "platforms;android-37.1" \
            "system-images;android-37.0;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd \
            --force \
            --name candy_edge_to_edge_ci \
            --package "system-images;android-37.0;google_apis;x86_64" \
            --device pixel_9_pro
          sudo chmod 666 /dev/kvm

      - name: Start dedicated emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator \
            -avd candy_edge_to_edge_ci \
            -port 5554 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/candy-edge-to-edge-emulator.log" 2>&1 &
          adb -s "$ANDROID_SERIAL" wait-for-device
          timeout 180 bash -c '
            until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do
              sleep 2
            done
          '
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          adb -s "$ANDROID_SERIAL" shell settings put secure show_ime_with_hard_keyboard 1
          adb -s "$ANDROID_SERIAL" shell dumpsys webviewupdate

      - name: Run GeckoView edge-to-edge regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:connectedFullDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=dev.sk2andy.materialbrowser.browser.gecko.GeckoEdgeToEdgeInstrumentedTest

      - name: Run System WebView edge-to-edge regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:connectedFullDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=dev.sk2andy.materialbrowser.browser.systemwebview.SystemWebViewEdgeToEdgeInstrumentedTest

      - name: Run document inset stability regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:connectedFullDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=dev.sk2andy.materialbrowser.browser.WebContentTopInsetScriptInstrumentedTest

      - name: Show emulator log after failure
        if: failure()
        shell: bash
        run: sed -n '1,400p' "$RUNNER_TEMP/candy-edge-to-edge-emulator.log"

      - name: Stop dedicated emulator
        if: always()
        shell: bash
        run: adb -s "$ANDROID_SERIAL" emu kill || true
