name: Edge-to-edge regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: edge-to-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-engines:
    name: GeckoView and System WebView safe-area contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android SDK platform 37.1
        shell: bash
        run: sdkmanager "platforms;android-37.1"

      - name: Build full debug app
        shell: bash
        run: ./gradlew --no-daemon :app:assembleFullDebug
